name: Sync with create-meith
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}

      - name: Re-scaffold from the latest create-meith and copy the result over this repo
        run: |
          BOARD_NAME=$(node -p "require('./package.json').name")
          SCRATCH="$RUNNER_TEMP/create-meith-sync"
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH"
          (cd "$SCRATCH" && npx --yes create-meith@latest "$BOARD_NAME" --no-git)
          rsync -a --delete --exclude='/.git/' --exclude='.github/workflows/sync.yml' "$SCRATCH/$BOARD_NAME/" ./
          rm -rf "$SCRATCH"

      - name: Prepend the template banner create-meith knows nothing about
        run: |
          {
            echo '> **You got this file by clicking "Use this template."** GitHub already'
            echo '> created this repository and its first commit for you, so the "push this'
            echo '> repository to GitHub" step below is already done — start at step 2:'
            echo '> point Coolify at it. Full walkthrough:'
            echo '> https://www.meith.dev/docs/quickstart#2-create-your-board'
            echo
            cat README.md
          } > README.md.new
          mv README.md.new README.md

      - name: Set aside workflow changes this run is not allowed to push
        id: workflows
        env:
          SYNC_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        run: |
          if [ -n "$SYNC_TOKEN" ]; then
            echo "held=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git status --porcelain -- .github/workflows | awk '{print $NF}')
          if [ -z "$CHANGED" ]; then
            echo "held=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -- .github/workflows 2>/dev/null || true
          git clean -fdq -- .github/workflows

          {
            echo 'held<<EOF'
            echo "$CHANGED"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Commit if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Sync scaffold with create-meith@latest'
          git push

      - name: Report the workflow files this run could not carry
        if: ${{ steps.workflows.outputs.held != '' }}
        run: |
          {
            echo '## Scaffold synced, workflow files held back'
            echo
            echo 'These files differ from the current scaffold and were left as they are:'
            echo
            echo '```'
            echo '${{ steps.workflows.outputs.held }}'
            echo '```'
            echo
            echo 'GitHub refuses a push that touches `.github/workflows/` when it is made'
            echo 'with the automatic `GITHUB_TOKEN`. Everything else in this sync was'
            echo 'pushed, so the board files above are current and these are not.'
            echo
            echo 'To let this job carry them too, add a repository secret named'
            echo '`TEMPLATE_SYNC_TOKEN` holding a token that may write workflow files — a'
            echo 'fine-grained PAT with **Contents: write** and **Workflows: write** on'
            echo 'this repository, or a classic PAT with the `workflow` scope. This job'
            echo 'picks it up automatically once it exists, and this step stops firing.'
            echo
            echo 'Until then, copy the files above out of `npx create-meith@latest` by hand.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Scaffold synced, but these workflow files were held back and are now stale: ${{ steps.workflows.outputs.held }}. See the job summary for the one-time fix."
          exit 1
